[project]
name = "wiflow"
version = "1.0.0"
description = "WiFlow: Estimating Optical Flow using WiFi Channel State Information"
authors = [
    {name = "Weigel, Thomas"},

]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "optical flow",
    "WiFi sensing",
    "channel state information",
    "CSI",
    "motion estimation",
    "deep learning",
    "RAFT",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.7",
    "tqdm>=4.65",
    "pydantic>=2.0",
    "tensorboard>=2.13",
    "huggingface-hub>=0.20",
    "sea-raft@git+https://github.com/tweigel-dev/SEA-RAFT.git",
    "mmfi-dataset@git+https://github.com/tweigel-dev/MMFi_dataset.git",
]

[project.urls]
Homepage = "https://visinf.github.io/wiflow"
Repository = "https://github.com/visinf/wiflow"
"Bug Tracker" = "https://github.com/visinf/wiflow/issues"

[project.optional-dependencies]
wavelet = ["PyWavelets>=1.4"]
dev = [
    "ruff>=0.4",
    "pytest>=7.0",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["WIFlow*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]